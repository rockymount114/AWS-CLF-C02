
{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="fw-bold mb-1"><i class="bi bi-shield-lock-fill text-warning me-2"></i> Admin Dashboard</h2>
    <p class="text-muted mb-0">System administration & management controls</p>
  </div>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 p-3 text-center bg-white">
      <div class="text-primary mb-1"><i class="bi bi-people-fill fs-2"></i></div>
      <h3 class="fw-bold mb-0 text-dark">{{ users }}</h3>
      <span class="text-muted small">Registered Users</span>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card shadow-sm border-0 p-3 text-center bg-white">
      <div class="text-warning mb-1"><i class="bi bi-question-circle-fill fs-2"></i></div>
      <h3 class="fw-bold mb-0 text-dark">{{ questions }}</h3>
      <span class="text-muted small">Total Questions</span>
    </div>
  </div>
</div>

<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white py-3">
    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-gear-wide-connected text-primary me-2"></i> Management Actions</h5>
  </div>
  <div class="card-body">
    <div class="d-flex flex-wrap gap-2">
      <a href="/admin/questions" class="btn btn-dark"><i class="bi bi-patch-question-fill me-1"></i> Manage Questions</a>
      <a href="{{ url_for('admin.export_questions') }}" class="btn btn-outline-secondary"><i class="bi bi-download me-1"></i> Export Questions (JSON)</a>
      <a href="/admin/import" class="btn btn-outline-info"><i class="bi bi-file-earmark-arrow-up me-1"></i> Import Markdown</a>
      <a href="/admin/users" class="btn btn-outline-dark"><i class="bi bi-people-fill me-1"></i> Manage Users</a>
    </div>
  </div>
</div>
{% endblock %}
