
{% extends 'base.html' %}{% block content %}<h3>Users</h3><table class="table"><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr>{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.username}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{u.is_active}}</td><td><a href="/admin/users/{{u.id}}/toggle" class="btn btn-sm btn-warning">Toggle</a> <a href="/admin/users/{{u.id}}/delete" class="btn btn-sm btn-danger">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
