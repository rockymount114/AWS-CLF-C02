version: '3.8'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - db
    command: bash -c "flask db upgrade || flask --app run db upgrade; python seed/seed.py || true; gunicorn --bind 0.0.0.0:5000 run:app"
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: aws_quiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  pgdata:
